[tool.poetry]
name = "turtlemd"
version = "2025.1"
description = "A slow molecular dynamics library for testing"
authors = [
    "Daniel Zhang <daniel.t.zhang@ntnu.no>",
    "Lukas Baldauf <lukas.baldauf@ntnu.no>",
    "Anders Lervik <andersle@gmail.com>",
]
license = "MIT"
readme = "README.md"

[tool.poetry.dependencies]
python = ">=3.12,<3.15"
numpy = "^1.24.2"

[tool.poetry.group.dev.dependencies]
ruff = "^0.14.0"
black = "^25.9.0"
mypy = "^1.18.0"
pytest = "^7.3.1"
pytest-cov = "^4.0.0"
pytest-randomly = "^3.12.0"
jupyter-black = "^0.3.4"
pre-commit = "^3.3.3"
flake8 = "^6.0.0"

[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["F", "E", "W", "I001", "UP"]

[tool.black]
line-length = 79
target-version = ["py312", "py313", "py314"]

[tool.mypy]
warn_unused_ignores = true
show_error_codes = true
plugins = "numpy.typing.mypy_plugin"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
